<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>ESP Flasher v2.3 Ultimate</title>
    <!-- Links CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    
    <style>
        :root {
            --primary: #001d3d; --secondary: #003566; --accent: #00b4d8;
            --background: #eef1f5; --success: #39ff14; --danger: #e03e3e;
            --console-bg: #000000; --monitor-text: #00e5ff;
        }

        body { background-color: var(--background); font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; margin: 0; }
        
        /* SIDEBAR */
        .sidebar {
            width: 80px; background-color: var(--primary); color: white;
            display: flex; flex-direction: column; padding: 20px 10px;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            z-index: 1000; overflow: hidden; white-space: nowrap;
            box-shadow: 4px 0 15px rgba(0,0,0,0.1);
        }
        .sidebar:hover { width: 260px; }
        .logo-area { text-align: center; margin-bottom: 40px; color: var(--accent); font-size: 1.5rem; display: flex; align-items: center; justify-content: center; height: 50px; }
        .logo-text { display: none; margin-left: 10px; font-weight: bold; }
        .sidebar:hover .logo-text { display: inline-block; }

        .nav-btn {
            background: transparent; color: #aeb9cc; border: none; padding: 15px; 
            width: 100%; text-align: left; margin-bottom: 5px; display: flex; align-items: center; border-radius: 8px;
            font-size: 16px;
        }
        .nav-btn i { width: 30px; font-size: 1.2rem; text-align: center; }
        .nav-text { display: none; margin-left: 15px; }
        .sidebar:hover .nav-text { display: inline-block; }
        .nav-btn:hover, .nav-btn.active { background-color: var(--secondary); color: white; cursor: pointer; }

        /* CONTEÚDO */
        .content { flex: 1; padding: 30px; overflow-y: auto; }
        .custom-card { 
            background: white; border-radius: 12px; padding: 25px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; 
            border-top: 4px solid var(--accent); 
        }

        /* CONSOLA COM ABAS */
        .console-wrapper {
            border: 1px solid #333; border-radius: 0 0 8px 8px; overflow: hidden;
            background: var(--console-bg); display: flex; flex-direction: column;
            height: 500px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        
        .console-tabs {
            display: flex; background: #222; border-radius: 8px 8px 0 0; overflow: hidden;
        }
        .console-tab {
            flex: 1; padding: 12px; text-align: center; cursor: pointer; color: #888;
            background: #1a1a1a; border: none; font-weight: bold; border-bottom: 3px solid transparent;
            transition: 0.2s; font-size: 14px;
        }
        .console-tab:hover { background: #333; color: white; }
        .console-tab.active { background: #000; color: white; border-bottom: 3px solid var(--accent); }

        .console-toolbar {
            background: #111; padding: 8px 15px; border-bottom: 1px solid #333;
            display: flex; justify-content: space-between; align-items: center; height: 50px;
        }
        
        .console-output {
            flex: 1; padding: 15px; overflow-y: auto; color: var(--success);
            font-family: 'Consolas', monospace; font-size: 13px; line-height: 1.5;
        }
        .serial-mode { color: var(--monitor-text) !important; }

        .console-output::-webkit-scrollbar { width: 8px; }
        .console-output::-webkit-scrollbar-track { background: #000; }
        .console-output::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        .log-line { margin: 0; border-bottom: 1px solid #111; padding: 2px 0; word-wrap: break-word; }

        .panel { display: none; animation: fadeIn 0.3s ease-in-out; }
        .panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="logo-area">
        <i class="fas fa-microchip"></i>
        <span class="logo-text">ESP Tool Pro</span>
    </div>
    
    <button class="nav-btn active" onclick="showPanel('painel-flash')">
        <i class="fas fa-bolt"></i><span class="nav-text">Flash & Monitor</span>
    </button>
    <button class="nav-btn" onclick="showPanel('painel-arquivos')">
        <i class="fas fa-folder-open"></i><span class="nav-text">Gestão Firmwares</span>
    </button>
    
    <div style="margin-top: auto; font-size: 11px; text-align: center; color: #666; padding-bottom: 10px;">
        v2.3
    </div>
</div>

<!-- CONTEÚDO -->
<div class="content">
    
    <div id="painel-flash" class="panel active">
        <h2 class="mb-4" style="color: var(--primary); font-weight: 700;">Painel de Controlo</h2>
        <div class="row">
            <!-- CONFIGURAÇÃO -->
            <div class="col-md-4">
                <div class="custom-card">
                    <h5 class="mb-4 text-secondary"><i class="fas fa-sliders-h me-2"></i>Configuração</h5>
                    
                    <label class="fw-bold small text-muted mb-1">PORTA COM</label>
                    <div class="input-group mb-3">
                        <select id="selectPorta" class="form-select border-secondary"></select>
                        <button class="btn btn-outline-secondary" onclick="carregarPortas()" title="Atualizar Lista"><i class="fas fa-sync"></i></button>
                    </div>

                    <label class="fw-bold small text-muted mb-1">VELOCIDADE</label>
                    <select id="selectBaud" class="form-select border-secondary mb-3">
                        <option value="921600">921600 (Rápido)</option>
                        <option value="460800" selected>460800 (Padrão)</option>
                        <option value="115200">115200 (Modo Seguro)</option>
                    </select>

                    <label class="fw-bold small text-muted mb-1">FIRMWARE (.BIN)</label>
                    <select id="selectFicheiro" class="form-select border-secondary mb-4"></select>

                    <hr class="text-muted">

                    <button onclick="iniciar('flash_limpo')" class="btn btn-primary w-100 py-3 fw-bold shadow mb-3 position-relative overflow-hidden">
                        <i class="fas fa-download me-2"></i> INSTALAR FIRMWARE
                    </button>

                    <button onclick="iniciar('apenas_limpar')" class="btn btn-outline-danger w-100 py-2 fw-bold">
                        <i class="fas fa-trash me-2"></i> LIMPAR MEMÓRIA
                    </button>
                </div>
            </div>

            <!-- CONSOLA DUPLA -->
            <div class="col-md-8">
                <div class="custom-card p-0" style="overflow: hidden; border: none; background: transparent; box-shadow: none;">
                    
                    <!-- ABAS -->
                    <div class="console-tabs">
                        <button class="console-tab active" onclick="switchConsole('install')" id="tab-install">
                            <i class="fas fa-cogs me-2"></i>LOG INSTALAÇÃO
                        </button>
                        <button class="console-tab" onclick="switchConsole('monitor')" id="tab-monitor">
                            <i class="fas fa-tv me-2"></i>MONITOR SERIAL
                        </button>
                    </div>

                    <div class="console-wrapper">
                        <!-- FERRAMENTAS -->
                        <div class="console-toolbar">
                            
                            <!-- Toolbar Instalação -->
                            <div id="tools-install" class="d-flex align-items-center w-100 justify-content-between">
                                <span class="text-white fw-bold small"><i class="fas fa-terminal me-2"></i>STATUS: <span id="status-text" class="text-info">Pronto</span></span>
                                <div>
                                    <button onclick="guardarLogs()" class="btn btn-sm btn-outline-light me-1"><i class="fas fa-save"></i> .txt</button>
                                    <button onclick="limparEcra()" class="btn btn-sm btn-outline-secondary"><i class="fas fa-eraser"></i></button>
                                </div>
                            </div>

                            <!-- Toolbar Monitor (AGORA COM BOTÃO DE GUARDAR) -->
                            <div id="tools-monitor" class="d-flex align-items-center w-100 justify-content-between" style="display: none !important;">
                                <div class="d-flex align-items-center">
                                    <select id="monitorBaud" class="form-select form-select-sm bg-dark text-white border-secondary me-2" style="width: 100px;">
                                        <option value="9600">9600</option>
                                        <option value="115200" selected>115200</option>
                                    </select>
                                    <button onclick="toggleMonitor()" id="btn-monitor" class="btn btn-sm btn-outline-info fw-bold">
                                        <i class="fas fa-plug me-1"></i> Conectar
                                    </button>
                                </div>
                                <div>
                                    <!-- BOTÃO DE GUARDAR NO MONITOR -->
                                    <button onclick="guardarLogs()" class="btn btn-sm btn-outline-light me-1" title="Guardar Logs do Monitor"><i class="fas fa-save"></i> .txt</button>
                                    <button onclick="limparEcra()" class="btn btn-sm btn-outline-secondary"><i class="fas fa-eraser"></i></button>
                                </div>
                            </div>
                        </div>
                        
                        <div class="progress" style="height: 4px; border-radius: 0; background-color: #222;">
                            <div id="barra" class="progress-bar bg-success" style="width: 0%; transition: width 0.3s;"></div>
                        </div>

                        <div id="consola" class="console-output">
                            <div style="color: #666;">> Sistema pronto. Selecione uma ação ou abra o Monitor Serial.</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- PAINEL GESTÃO -->
    <div id="painel-arquivos" class="panel">
        <h2 class="mb-4" style="color: var(--primary); font-weight: 700;">Gestão de Firmwares</h2>
        <div class="row">
            <div class="col-md-6">
                <div class="custom-card">
                    <h5 class="mb-3">Adicionar Ficheiro</h5>
                    <div class="input-group mb-4">
                        <input type="file" id="upFile" class="form-control" accept=".bin">
                        <button class="btn btn-dark" onclick="upload()"><i class="fas fa-upload me-2"></i>Carregar</button>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="custom-card">
                    <h5 class="mb-3">Ficheiros Locais</h5>
                    <ul id="listaFiles" class="list-group list-group-flush"></ul>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    const socket = io();
    const consola = document.getElementById('consola');
    let activeTab = 'install';
    let monitorConnected = false;

    function switchConsole(mode) {
        activeTab = mode;
        document.querySelectorAll('.console-tab').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-' + mode).classList.add('active');

        const toolsInstall = document.getElementById('tools-install');
        const toolsMonitor = document.getElementById('tools-monitor');
        
        if(mode === 'install') {
            toolsInstall.style.setProperty('display', 'flex', 'important');
            toolsMonitor.style.setProperty('display', 'none', 'important');
            consola.classList.remove('serial-mode');
        } else {
            toolsInstall.style.setProperty('display', 'none', 'important');
            toolsMonitor.style.setProperty('display', 'flex', 'important');
            consola.classList.add('serial-mode');
        }
        consola.innerHTML += `<div class='log-line' style='color: #666; border-top: 1px dashed #333; margin-top: 10px;'>>> ABA ATIVA: ${mode.toUpperCase()}</div>`;
        consola.scrollTop = consola.scrollHeight;
    }

    function toggleMonitor() {
        const porta = document.getElementById('selectPorta').value;
        const baud = document.getElementById('monitorBaud').value;
        const btn = document.getElementById('btn-monitor');

        if (!monitorConnected) {
            if(!porta) return alert("Selecione uma porta primeiro!");
            socket.emit('iniciar_monitor', { porta, baud });
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> A Ligar...';
        } else {
            socket.emit('parar_monitor');
            btn.innerHTML = '<i class="fas fa-plug me-1"></i> Conectar';
        }
    }

    socket.on('status_monitor', msg => {
        const btn = document.getElementById('btn-monitor');
        monitorConnected = msg.ativo;
        if (msg.ativo) {
            btn.innerHTML = '<i class="fas fa-power-off me-1"></i> Desconectar';
            btn.className = 'btn btn-sm btn-danger fw-bold';
            consola.innerHTML += `<div class='log-line' style='color: white;'>>> MONITOR LIGADO: ${msg.msg}</div>`;
        } else {
            btn.innerHTML = '<i class="fas fa-plug me-1"></i> Conectar';
            btn.className = 'btn btn-sm btn-outline-info fw-bold';
            consola.innerHTML += `<div class='log-line' style='color: #f77;'>>> MONITOR DESLIGADO.</div>`;
        }
        consola.scrollTop = consola.scrollHeight;
    });

    socket.on('log_monitor', msg => {
        if(activeTab !== 'monitor') return;
        const div = document.createElement('div');
        div.className = 'log-line';
        div.innerText = msg.data;
        consola.appendChild(div);
        consola.scrollTop = consola.scrollHeight;
    });

    function iniciar(modo) {
        if (monitorConnected) toggleMonitor(); 
        if(activeTab !== 'install') switchConsole('install');

        const porta = document.getElementById('selectPorta').value;
        const ficheiro = document.getElementById('selectFicheiro').value;
        const baud = document.getElementById('selectBaud').value;
        
        if (!porta) return alert("Porta COM obrigatória!");
        if (modo === 'flash_limpo' && !ficheiro) return alert("Selecione ficheiro!");

        document.getElementById('status-text').innerText = "A Executar...";
        document.getElementById('status-text').className = "text-warning fw-bold";
        document.getElementById('barra').style.width = "5%";
        document.getElementById('barra').className = "progress-bar progress-bar-striped progress-bar-animated bg-info";
        
        socket.emit('iniciar_processo', { porta, baud, ficheiro, modo });
    }

    socket.on('log_flash', msg => {
        if(activeTab !== 'install') return;
        const div = document.createElement('div');
        div.className = 'log-line';
        div.innerText = "> " + msg.data;
        consola.appendChild(div);
        consola.scrollTop = consola.scrollHeight;
        if(msg.data.includes("Writing")) document.getElementById('barra').style.width = "60%";
    });

    socket.on('fim_processo', () => {
        document.getElementById('barra').style.width = "100%";
        document.getElementById('barra').className = "progress-bar bg-success";
        document.getElementById('status-text').innerText = "Concluído";
        document.getElementById('status-text').className = "text-success fw-bold";
        consola.innerHTML += "<div class='log-line' style='color: white; font-weight: bold; margin-top: 10px;'>>> PROCESSO CONCLUÍDO!</div>";
        consola.scrollTop = consola.scrollHeight;
    });

    function showPanel(id) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        const buttons = document.querySelectorAll('.nav-btn');
        if(id === 'painel-flash') buttons[0].classList.add('active');
        if(id === 'painel-arquivos') buttons[1].classList.add('active');
        if(id === 'painel-flash') carregarDados(); else carregarArquivos();
    }

    async function carregarPortas() {
        try {
            const res = await fetch('/listar_portas');
            const dados = await res.json();
            const sel = document.getElementById('selectPorta');
            const atual = sel.value;
            sel.innerHTML = "";
            if(dados.length === 0) { sel.add(new Option("Nenhuma porta encontrada", "")); return; }
            dados.forEach(p => {
                let nome = p.device + " | " + p.description;
                if(p.description.match(/CP210|CH340|Serial|USB/i)) nome = "⭐ " + nome;
                sel.add(new Option(nome, p.device));
            });
            if(atual) sel.value = atual;
        } catch(e) { console.error(e); }
    }

    async function carregarDados() {
        carregarPortas();
        const res = await fetch('/listar_ficheiros');
        const files = await res.json();
        const sel = document.getElementById('selectFicheiro');
        const atual = sel.value;
        sel.innerHTML = "";
        files.forEach(f => sel.add(new Option(f, f)));
        if(atual) sel.value = atual;
    }

    function limparEcra() {
        consola.innerHTML = "<div style='color: #666;'>> Consola limpa.</div>";
        document.getElementById('barra').style.width = "0%";
    }

    function guardarLogs() {
        const texto = consola.innerText;
        const blob = new Blob([texto], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = window.URL.createObjectURL(blob);
        a.download = "log_monitor.txt";
        a.click();
    }

    async function carregarArquivos() {
        const res = await fetch('/listar_ficheiros');
        const files = await res.json();
        const lista = document.getElementById('listaFiles');
        lista.innerHTML = "";
        if(files.length === 0) { lista.innerHTML = "<li class='list-group-item text-muted'>Pasta vazia</li>"; return; }
        files.forEach(f => {
            lista.innerHTML += `<li class="list-group-item d-flex justify-content-between align-items-center"><span><i class="fas fa-file-code me-2 text-primary"></i>${f}</span><button class="btn btn-sm btn-outline-danger" onclick="apagar('${f}')"><i class="fas fa-trash"></i></button></li>`;
        });
    }

    async function upload() {
        const input = document.getElementById('upFile');
        if(input.files.length === 0) return alert("Selecione ficheiro!");
        const fd = new FormData();
        fd.append('file', input.files[0]);
        const res = await fetch('/upload', { method: 'POST', body: fd });
        if(res.ok) { input.value=""; carregarArquivos(); alert("Upload OK!"); }
    }

    async function apagar(f) {
        if(confirm("Apagar " + f + "?")) {
            await fetch('/delete_file', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({filename: f}) });
            carregarArquivos();
        }
    }

    carregarDados();
</script>
</body>
</html>
