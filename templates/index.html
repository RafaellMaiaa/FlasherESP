<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP Flasher v2.5 Ultimate</title>
    <!-- Bibliotecas Externas -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    
    <style>
        :root {
            --primary: #001d3d; --secondary: #003566; --accent: #00b4d8;
            --background: #eef1f5; --success: #39ff14; --danger: #ff4d4d;
            --console-bg: #0d0d0d; --monitor-text: #00e5ff;
            --log-dim: #666;
        }

        body { background-color: var(--background); font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; margin: 0; }
        
        /* SIDEBAR PROFISSIONAL */
        .sidebar {
            width: 80px; background-color: var(--primary); color: white;
            display: flex; flex-direction: column; padding: 20px 10px;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            z-index: 1000; overflow: hidden; white-space: nowrap;
            box-shadow: 4px 0 15px rgba(0,0,0,0.1);
        }
        .sidebar:hover { width: 260px; }
        .logo-area { text-align: center; margin-bottom: 40px; color: var(--accent); font-size: 1.5rem; display: flex; align-items: center; justify-content: center; height: 50px; }
        .logo-text { display: none; margin-left: 10px; font-weight: bold; }
        .sidebar:hover .logo-text { display: inline-block; }

        .nav-btn {
            background: transparent; color: #aeb9cc; border: none; padding: 15px; 
            width: 100%; text-align: left; margin-bottom: 5px; display: flex; align-items: center; border-radius: 8px;
            font-size: 16px; transition: 0.2s;
        }
        .nav-btn i { width: 30px; font-size: 1.2rem; text-align: center; }
        .nav-text { display: none; margin-left: 15px; }
        .sidebar:hover .nav-text { display: inline-block; }
        .nav-btn:hover, .nav-btn.active { background-color: var(--secondary); color: white; cursor: pointer; }

        /* Botão Sair Especial */
        .btn-exit { margin-top: auto; color: #ff6b6b !important; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px; }
        .btn-exit:hover { background-color: var(--danger) !important; color: white !important; }

        /* CONTEÚDO */
        .content { flex: 1; padding: 30px; overflow-y: auto; }
        .custom-card { 
            background: white; border-radius: 12px; padding: 25px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; 
            border-top: 4px solid var(--accent); 
        }

        /* CONSOLA COM ABAS */
        .console-wrapper {
            border: 1px solid #333; border-radius: 0 0 8px 8px; overflow: hidden;
            background: var(--console-bg); display: flex; flex-direction: column;
            height: 520px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .console-tabs { display: flex; background: #1a1a1a; border-radius: 8px 8px 0 0; }
        .console-tab {
            flex: 1; padding: 12px; text-align: center; cursor: pointer; color: #666;
            background: #1a1a1a; border: none; font-weight: bold; border-bottom: 3px solid transparent;
            transition: 0.2s; font-size: 13px; text-transform: uppercase; letter-spacing: 1px;
        }
        .console-tab:hover { background: #222; color: #999; }
        .console-tab.active { background: #000; color: white; border-bottom: 3px solid var(--accent); }

        .console-toolbar {
            background: #111; padding: 8px 15px; border-bottom: 1px solid #222;
            display: flex; justify-content: space-between; align-items: center; height: 50px;
        }
        
        .console-output {
            flex: 1; padding: 15px; overflow-y: auto; color: #ccc;
            font-family: 'Consolas', 'Monaco', monospace; font-size: 13px; line-height: 1.6;
        }

        .log-line { margin: 0; padding: 1px 0; word-wrap: break-word; }
        .log-install { color: var(--success); }
        .log-monitor { color: var(--monitor-text); }
        .log-error { color: var(--danger) !important; font-weight: bold; }
        .log-header { 
            color: #fff; background: rgba(0,180,216,0.2); 
            padding: 5px 10px; margin: 10px 0; border-radius: 4px; 
            display: block; font-weight: bold; border-left: 4px solid var(--accent);
        }

        .progress { background-color: #222; border-radius: 0; }

        .panel { display: none; animation: fadeIn 0.3s ease-in-out; }
        .panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Tela de Logout Centrada */
        .shutdown-screen {
            background-color: #000;
            color: white;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
        }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="logo-area"><i class="fas fa-microchip"></i><span class="logo-text">ESP Tool Pro</span></div>
    
    <button class="nav-btn active" onclick="showPanel('painel-flash')">
        <i class="fas fa-bolt"></i><span class="nav-text">Flash & Monitor</span>
    </button>
    <button class="nav-btn" onclick="showPanel('painel-arquivos')">
        <i class="fas fa-folder-open"></i><span class="nav-text">Gestão Firmwares</span>
    </button>
    
    <button class="nav-btn btn-exit" onclick="fecharAplicacao()">
        <i class="fas fa-power-off"></i><span class="nav-text">Sair / Encerrar</span>
    </button>
    
    <div style="font-size: 10px; text-align: center; color: #666; padding: 10px;">v2.5</div>
</div>

<!-- CONTEÚDO -->
<div class="content">
    
    <div id="painel-flash" class="panel active">
        <h2 class="mb-4" style="color: var(--primary); font-weight: 700;">Painel de Controlo</h2>
        <div class="row">
            <div class="col-md-4">
                <div class="custom-card">
                    <h5 class="mb-4 text-secondary"><i class="fas fa-sliders-h me-2"></i>Configuração</h5>
                    
                    <label class="fw-bold small text-muted mb-1">PORTA COM</label>
                    <div class="input-group mb-3">
                        <select id="selectPorta" class="form-select border-secondary"></select>
                        <button class="btn btn-outline-secondary" onclick="carregarPortas()"><i class="fas fa-sync"></i></button>
                    </div>

                    <label class="fw-bold small text-muted mb-1">VELOCIDADE (FLASH)</label>
                    <select id="selectBaud" class="form-select border-secondary mb-3">
                        <option value="9600">9600</option>
                        <option value="57600">57600</option>
                        <option value="74880">74880</option>
                        <option value="115200">115200 (Seguro)</option>
                        <option value="230400">230400</option>
                        <option value="460800" selected>460800 (Padrão)</option>
                        <option value="921600">921600 (Rápido)</option>
                        <option value="1500000">1.5M</option>
                        <option value="2000000">2M</option>
                    </select>

                    <label class="fw-bold small text-muted mb-1">FIRMWARE (.BIN)</label>
                    <select id="selectFicheiro" class="form-select border-secondary mb-4"></select>

                    <button onclick="iniciar('flash_limpo')" class="btn btn-primary w-100 py-3 fw-bold shadow mb-3">
                        <i class="fas fa-download me-2"></i> INSTALAR FIRMWARE
                    </button>

                    <button onclick="iniciar('apenas_limpar')" class="btn btn-outline-danger w-100 py-2 fw-bold">
                        <i class="fas fa-trash me-2"></i> LIMPAR MEMÓRIA
                    </button>
                </div>
            </div>

            <div class="col-md-8">
                <div class="custom-card p-0" style="background: transparent; border: none; box-shadow: none;">
                    <div class="console-tabs">
                        <button class="console-tab active" onclick="switchConsole('install')" id="tab-install">
                            <i class="fas fa-tools me-1"></i> Instalação
                        </button>
                        <button class="console-tab" onclick="switchConsole('monitor')" id="tab-monitor">
                            <i class="fas fa-microscope me-1"></i> Monitor Serial
                        </button>
                    </div>

                    <div class="console-wrapper">
                        <div class="console-toolbar">
                            <div id="tools-install" class="d-flex align-items-center w-100 justify-content-between">
                                <span class="text-white small fw-bold">STATUS: <span id="status-text" class="text-info">PRONTO</span></span>
                                <div>
                                    <button onclick="guardarLogs()" class="btn btn-sm btn-outline-light" title="Guardar .txt"><i class="fas fa-save"></i></button>
                                    <button onclick="limparEcra()" class="btn btn-sm btn-outline-secondary ms-1" title="Limpar"><i class="fas fa-eraser"></i></button>
                                </div>
                            </div>
                            <div id="tools-monitor" class="d-flex align-items-center w-100 justify-content-between" style="display: none !important;">
                                <div class="d-flex align-items-center">
                                    <select id="monitorBaud" class="form-select form-select-sm bg-dark text-white border-secondary me-2" style="width: 110px;">
                                        <option value="1200">1200</option>
                                        <option value="2400">2400</option>
                                        <option value="4800">4800</option>
                                        <option value="9600">9600</option>
                                        <option value="19200">19200</option>
                                        <option value="38400">38400</option>
                                        <option value="57600">57600</option>
                                        <option value="74880">74880</option>
                                        <option value="115200" selected>115200</option>
                                        <option value="230400">230400</option>
                                        <option value="250000">250000</option>
                                        <option value="460800">460800</option>
                                        <option value="921600">921600</option>
                                    </select>
                                    <button onclick="toggleMonitor()" id="btn-monitor" class="btn btn-sm btn-outline-info fw-bold">Conectar</button>
                                </div>
                                <div>
                                    <button onclick="guardarLogs()" class="btn btn-sm btn-outline-light" title="Guardar .txt"><i class="fas fa-save"></i></button>
                                    <button onclick="limparEcra()" class="btn btn-sm btn-outline-secondary ms-1" title="Limpar"><i class="fas fa-eraser"></i></button>
                                </div>
                            </div>
                        </div>
                        
                        <div class="progress" style="height: 4px;">
                            <div id="barra" class="progress-bar bg-success progress-bar-striped progress-bar-animated" style="width: 0%; transition: 0.3s;"></div>
                        </div>

                        <div id="consola" class="console-output">
                            <div style="color: #666;">> Aguardando comando do utilizador...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- PAINEL GESTÃO FICHEIROS -->
    <div id="painel-arquivos" class="panel">
        <h2 class="mb-4" style="color: var(--primary); font-weight: 700;">Gestão de Firmwares</h2>
        <div class="row">
            <div class="col-md-6">
                <div class="custom-card">
                    <h5 class="mb-3">Adicionar Ficheiro</h5>
                    <div class="input-group mb-4">
                        <input type="file" id="upFile" class="form-control" accept=".bin">
                        <button class="btn btn-dark" onclick="upload()">Carregar</button>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="custom-card">
                    <h5 class="mb-3">Ficheiros Disponíveis</h5>
                    <ul id="listaFiles" class="list-group list-group-flush"></ul>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const socket = io();
    const consola = document.getElementById('consola');
    let activeTab = 'install';
    let monitorConnected = false;

    function cleanANSI(text) {
        return text.replace(/\x1b\[[0-9;]*[a-zA-Z]/g, '').replace(/\x1b\[K/g, '');
    }

    function switchConsole(mode) {
        activeTab = mode;
        document.querySelectorAll('.console-tab').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-' + mode).classList.add('active');
        
        document.getElementById('tools-install').style.setProperty('display', mode === 'install' ? 'flex' : 'none', 'important');
        document.getElementById('tools-monitor').style.setProperty('display', mode === 'monitor' ? 'flex' : 'none', 'important');
        
        const header = document.createElement('div');
        header.className = 'log-header';
        header.innerHTML = `<i class="fas fa-exchange-alt me-2"></i> MODO: ${mode.toUpperCase()}`;
        consola.appendChild(header);
        consola.scrollTop = consola.scrollHeight;
        
        if(mode === 'monitor') consola.classList.add('serial-mode');
        else consola.classList.remove('serial-mode');
    }

    function toggleMonitor() {
        const porta = document.getElementById('selectPorta').value;
        const baud = document.getElementById('monitorBaud').value;
        const btn = document.getElementById('btn-monitor');

        if (!monitorConnected) {
            if(!porta) return alert("Selecione uma porta COM!");
            socket.emit('iniciar_monitor', { porta, baud });
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> A ligar...';
        } else {
            socket.emit('parar_monitor');
        }
    }

    socket.on('status_monitor', msg => {
        const btn = document.getElementById('btn-monitor');
        monitorConnected = msg.ativo;
        const line = document.createElement('div');
        line.className = 'log-line ' + (msg.ativo ? 'log-install' : 'log-error');
        
        if (msg.ativo) {
            btn.innerText = 'Desconectar';
            btn.className = 'btn btn-sm btn-danger fw-bold';
            line.innerHTML = `<strong>>> MONITOR LIGADO:</strong> ${msg.msg}`;
        } else {
            btn.innerText = 'Conectar';
            btn.className = 'btn btn-sm btn-outline-info fw-bold';
            line.innerHTML = `<strong>>> MONITOR DESLIGADO.</strong>`;
        }
        consola.appendChild(line);
        consola.scrollTop = consola.scrollHeight;
    });

    socket.on('log_monitor', msg => {
        if(activeTab === 'monitor') {
            const div = document.createElement('div');
            div.className = 'log-line log-monitor';
            div.innerText = msg.data;
            consola.appendChild(div);
            if (consola.childNodes.length > 500) consola.removeChild(consola.firstChild);
            consola.scrollTop = consola.scrollHeight;
        }
    });

    function iniciar(modo) {
        if (monitorConnected) socket.emit('parar_monitor');
        if (activeTab !== 'install') switchConsole('install');

        const porta = document.getElementById('selectPorta').value;
        const ficheiro = document.getElementById('selectFicheiro').value;
        const baud = document.getElementById('selectBaud').value;
        
        if (!porta || (modo === 'flash_limpo' && !ficheiro)) return alert("Configure a porta e o ficheiro!");

        document.getElementById('status-text').innerText = "A PROCESSAR...";
        document.getElementById('status-text').className = "text-warning fw-bold";
        document.getElementById('barra').style.width = "5%";
        socket.emit('iniciar_processo', { porta, baud, ficheiro, modo });
    }

    socket.on('log_flash', msg => {
        if(activeTab === 'install') {
            let cleanData = cleanANSI(msg.data);
            if (!cleanData.trim()) return;

            const isFinished = cleanData.includes("Hard resetting") || cleanData.includes("Wrote");
            if (isFinished) {
                document.getElementById('status-text').innerText = "CONCLUÍDO";
                document.getElementById('status-text').className = "text-success fw-bold";
                document.getElementById('barra').style.width = "100%";
            }

            const isProgress = cleanData.includes("Writing at") || cleanData.includes("bytes...");
            if (isProgress) {
                let lastLine = consola.lastElementChild;
                if (lastLine && (lastLine.innerText.includes("Writing at") || lastLine.innerText.includes("bytes..."))) {
                    lastLine.innerText = "> " + cleanData;
                } else {
                    const div = document.createElement('div');
                    div.className = 'log-line log-install';
                    div.innerText = "> " + cleanData;
                    consola.appendChild(div);
                }
                if(cleanData.includes("Writing at")) document.getElementById('barra').style.width = "75%";
            } else {
                const div = document.createElement('div');
                div.className = 'log-line log-install';
                if (cleanData.toLowerCase().includes("error") || cleanData.toLowerCase().includes("failed")) {
                    div.className += " log-error";
                    document.getElementById('status-text').innerText = "ERRO";
                    document.getElementById('status-text').className = "text-danger fw-bold";
                }
                div.innerText = "> " + cleanData;
                consola.appendChild(div);
            }
            consola.scrollTop = consola.scrollHeight;
        }
    });

    socket.on('fim_processo', () => {
        if (document.getElementById('status-text').innerText === "A PROCESSAR...") {
            document.getElementById('status-text').innerText = "CONCLUÍDO";
            document.getElementById('status-text').className = "text-success fw-bold";
            document.getElementById('barra').style.width = "100%";
        }
    });

    function fecharAplicacao() {
        if(confirm("Tem a certeza que deseja encerrar a aplicação?")) {
            fetch('/shutdown', { method: 'POST' });
            
            // Criação da tela de encerramento centrada
            const overlay = document.createElement('div');
            overlay.className = 'shutdown-screen';
            overlay.innerHTML = `
                <div>
                    <i class='fas fa-power-off fa-5x mb-4' style='color:var(--danger)'></i>
                    <h1 class='display-3 fw-bold'>Servidor Encerrado</h1>
                    <p class='lead mb-4'>A ligação ao hardware foi cortada com segurança.</p>
                    <div class='badge bg-secondary p-2 fs-6'>Pode fechar esta janela agora.</div>
                </div>
            `;
            document.body.innerHTML = "";
            document.body.appendChild(overlay);
            
            setTimeout(() => window.close(), 3000);
        }
    }

    function showPanel(id) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        const buttons = document.querySelectorAll('.nav-btn');
        if(id === 'painel-flash') buttons[0].classList.add('active');
        if(id === 'painel-arquivos') buttons[1].classList.add('active');
        if(id === 'painel-flash') carregarDados(); else carregarArquivos();
    }

    async function carregarPortas() {
        try {
            const res = await fetch('/listar_portas');
            const dados = await res.json();
            const sel = document.getElementById('selectPorta');
            const atual = sel.value;
            sel.innerHTML = "";
            if(dados.length === 0) { sel.add(new Option("Nenhum dispositivo encontrado", "")); return; }
            dados.forEach(p => {
                let nome = p.device + (p.description ? " (" + p.description + ")" : "");
                if(p.description.match(/CP210|CH340|Serial|USB/i)) nome = "⭐ " + nome;
                sel.add(new Option(nome, p.device));
            });
            if(atual) sel.value = atual;
        } catch(e) { console.error(e); }
    }

    async function carregarDados() {
        carregarPortas();
        const res = await fetch('/listar_ficheiros');
        const files = await res.json();
        const sel = document.getElementById('selectFicheiro');
        const atual = sel.value;
        sel.innerHTML = "";
        files.forEach(f => sel.add(new Option(f, f)));
        if(atual) sel.value = atual;
    }

    function limparEcra() { consola.innerHTML = ""; document.getElementById('barra').style.width = "0%"; }
    
    function guardarLogs() { 
        const blob = new Blob([consola.innerText], {type:'text/plain'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = (activeTab === 'install' ? 'flash_log_' : 'serial_log_') + new Date().getTime() + ".txt";
        a.click();
    }

    async function carregarArquivos() {
        const res = await fetch('/listar_ficheiros');
        const files = await res.json();
        const lista = document.getElementById('listaFiles');
        lista.innerHTML = "";
        if(files.length === 0) { lista.innerHTML = "<li class='list-group-item text-muted'>Sem ficheiros</li>"; return; }
        files.forEach(f => {
            lista.innerHTML += `<li class="list-group-item d-flex justify-content-between align-items-center">
                <span><i class="fas fa-file-code me-2 text-primary"></i>${f}</span>
                <button class="btn btn-sm btn-outline-danger" onclick="apagar('${f}')"><i class="fas fa-trash"></i></button>
            </li>`;
        });
    }

    async function upload() {
        const input = document.getElementById('upFile');
        if(input.files.length === 0) return alert("Selecione um ficheiro!");
        const fd = new FormData(); fd.append('file', input.files[0]);
        const res = await fetch('/upload', { method: 'POST', body: fd });
        if(res.ok) { input.value=""; carregarArquivos(); }
    }

    async function apagar(f) {
        if(confirm("Apagar ficheiro " + f + "?")) {
            await fetch('/delete_file', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({filename: f}) });
            carregarArquivos();
        }
    }

    carregarDados();
</script>
</body>
</html>
