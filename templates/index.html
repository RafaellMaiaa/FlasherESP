<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP Flasher v2.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    
    <style>
        :root {
            --primary: #001d3d;      /* Azul Noite */
            --secondary: #003566;    /* Azul Real Escuro */
            --accent: #00b4d8;       /* Ciano Pacífico */
            --background: #f8f9fa;   /* Branco Gelo */
            --success: #2dc653;      /* Verde Esmeralda */
            --danger: #e03e3e;       /* Vermelho Fogo */
            --console-bg: #000814;   /* Preto para Consola */
        }

        body { background-color: var(--background); font-family: 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; margin: 0; }
        
        /* --- SIDEBAR RETRÁTIL --- */
        .wrapper { display: flex; height: 100%; }
        
        .sidebar {
            width: 80px;
            background-color: var(--primary);
            color: white;
            display: flex;
            flex-direction: column;
            padding: 20px 10px;
            box-shadow: 4px 0 10px rgba(0,0,0,0.1);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            white-space: nowrap;
            z-index: 1000;
        }

        .sidebar:hover { width: 260px; }

        .logo-area { 
            text-align: center; 
            margin-bottom: 40px; 
            color: var(--accent);
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-text { display: none; margin-left: 10px; font-weight: bold; }
        .sidebar:hover .logo-text { display: inline-block; }

        .nav-btn {
            background: transparent;
            color: #aeb9cc;
            border: none;
            padding: 15px;
            text-align: left;
            width: 100%;
            border-radius: 8px;
            transition: 0.3s;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            font-size: 16px;
        }
        .nav-btn i { width: 30px; font-size: 1.2rem; text-align: center; }
        .nav-text { display: none; margin-left: 15px; }
        .sidebar:hover .nav-text { display: inline-block; }

        .nav-btn:hover { background-color: var(--secondary); color: white; cursor: pointer; }
        .nav-btn.active { background-color: var(--accent); color: var(--primary); font-weight: bold; }

        .footer-version {
            margin-top: auto;
            font-size: 12px;
            color: #666;
            text-align: center;
            display: none;
        }
        .sidebar:hover .footer-version { display: block; }

        /* --- CONTEÚDO --- */
        .content { flex: 1; padding: 30px; overflow-y: auto; }
        
        .custom-card {
            background: white;
            border: none;
            border-top: 4px solid var(--accent);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 25px;
            margin-bottom: 20px;
        }
        .card-title { color: var(--primary); font-weight: 600; margin-bottom: 20px; }

        .btn-flash { background-color: var(--success); color: white; padding: 15px; font-weight: bold; font-size: 1.2rem; border: none; width: 100%; border-radius: 8px; }
        .btn-flash:hover { background-color: #25a344; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        
        .btn-erase { background-color: var(--danger); color: white; border: none; width: 100%; border-radius: 8px; }
        .btn-erase:hover { background-color: #c92a2a; }

        .btn-secondary-custom { background-color: var(--secondary); color: white; border: none; }

        /* --- CONSOLA --- */
        .console-container {
            background-color: var(--console-bg);
            border-radius: 8px;
            padding: 15px;
            height: 450px;
            overflow-y: auto;
            border: 1px solid var(--secondary);
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            color: #e0e0e0;
        }
        .log-line { margin: 0; line-height: 1.4; border-bottom: 1px solid #001d3d; padding: 2px 0; }
        .log-success { color: var(--success); font-weight: bold; }
        .log-error { color: var(--danger); font-weight: bold; }
        .log-info { color: var(--accent); }

        .progress { height: 10px; background-color: #dee2e6; border-radius: 5px; }
        .progress-bar { background-color: var(--accent); transition: width 0.4s ease; }

        .panel { display: none; }
        .panel.active { display: block; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="sidebar">
        <div class="logo-area">
            <i class="fas fa-microchip"></i>
            <span class="logo-text">ESP Flasher</span>
        </div>

        <button class="nav-btn active" onclick="showPanel('painel-flash')">
            <i class="fas fa-bolt"></i>
            <span class="nav-text">Flash & Monitor</span>
        </button>
        <button class="nav-btn" onclick="showPanel('painel-arquivos')">
            <i class="fas fa-folder-open"></i>
            <span class="nav-text">Firmwares</span>
        </button>
        
        <div class="footer-version">
            ESP Flasher v2.0
        </div>
    </div>

    <div class="content">
        
        <div id="painel-flash" class="panel active">
            <h2 class="mb-4" style="color: var(--primary)">Painel de Controlo</h2>
            
            <div class="row">
                <div class="col-md-4">
                    <div class="custom-card">
                        <h5 class="card-title"><i class="fas fa-cogs"></i> Configuração</h5>
                        
                        <label class="form-label text-muted small fw-bold">DISPOSITIVO USB</label>
                        <div class="input-group mb-3">
                            <select id="selectPorta" class="form-select border-secondary"></select>
                            <button class="btn btn-secondary-custom" onclick="carregarPortas()" title="Atualizar"><i class="fas fa-sync"></i></button>
                        </div>

                        <label class="form-label text-muted small fw-bold">BAUD RATE</label>
                        <select id="selectBaud" class="form-select border-secondary mb-3">
                            <option value="115200">115200 (Seguro)</option>
                            <option value="460800">460800 (Normal)</option>
                            <option value="921600" selected>921600 (Rápido)</option>
                        </select>

                        <label class="form-label text-muted small fw-bold">FIRMWARE SELECIONADO</label>
                        <select id="selectFicheiro" class="form-select border-secondary mb-4"></select>

                        <hr>
                        
                        <div class="d-grid gap-2">
                            <button onclick="iniciarProcesso('flash_limpo')" class="btn btn-flash shadow">
                                <i class="fas fa-play"></i> INSTALAR (Limpo)
                                <div style="font-size: 11px; font-weight: normal; opacity: 0.9">Auto-Reset & Reiniciar</div>
                            </button>
                            
                            <button onclick="iniciarProcesso('apenas_limpar')" class="btn btn-erase btn-sm mt-3 py-2">
                                <i class="fas fa-trash-alt"></i> Formatar Memória (Erase)
                            </button>
                        </div>
                    </div>
                </div>

                <div class="col-md-8">
                    <div class="custom-card">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5 class="card-title m-0"><i class="fas fa-terminal"></i> Consola de Debug</h5>
                            <div>
                                <button onclick="baixarLogs()" class="btn btn-sm btn-outline-secondary me-1"><i class="fas fa-download"></i> .txt</button>
                                <button onclick="limparConsola()" class="btn btn-sm btn-outline-danger"><i class="fas fa-eraser"></i> Limpar</button>
                            </div>
                        </div>
                        
                        <div class="progress mb-2">
                            <div id="barraProgresso" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%"></div>
                        </div>
                        <div id="statusTexto" class="text-end small text-muted mb-2">A aguardar porta...</div>

                        <div id="consola" class="console-container">
                            <div class="log-line text-muted">Pronto. Escolha um firmware e clique em Instalar.</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="painel-arquivos" class="panel">
            <h2 class="mb-4" style="color: var(--primary)">Gestão de Firmwares</h2>
            
            <div class="custom-card">
                <h5 class="card-title">Upload de Firmware (.bin)</h5>
                <div class="input-group mb-3">
                    <input type="file" class="form-control" id="uploadInput" accept=".bin">
                    <button class="btn btn-secondary-custom" onclick="fazerUpload()">Upload</button>
                </div>
            </div>

            <div class="custom-card">
                <h5 class="card-title">Arquivos na Pasta 'firmwares'</h5>
                <ul id="listaFicheirosGestao" class="list-group list-group-flush"></ul>
            </div>
        </div>
    </div>
</div>

<script>
    const socket = io();
    const consolaDiv = document.getElementById('consola');
    let logsAcumulados = "";

    function showPanel(panelId) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(panelId).classList.add('active');
        
        const botoes = document.querySelectorAll('.nav-btn');
        if(panelId === 'painel-flash') { botoes[0].classList.add('active'); carregarDados(); }
        if(panelId === 'painel-arquivos') { botoes[1].classList.add('active'); carregarListaGestao(); }
    }

    async function carregarPortas() {
        const res = await fetch('/listar_portas');
        const portas = await res.json();
        const sel = document.getElementById('selectPorta');
        sel.innerHTML = "";

        if(portas.length === 0) {
            sel.add(new Option("Nenhuma porta encontrada", ""));
            return;
        }

        portas.forEach(p => {
            let desc = p.description.toLowerCase();
            let label = `${p.device} | ${p.description}`;
            let isESP = desc.includes('cp210') || desc.includes('ch340') || desc.includes('serial') || desc.includes('uart');
            
            let opt = new Option(isESP ? "🤖 " + label + " (Recomendado)" : label, p.device);
            if(isESP) { opt.style.fontWeight = "bold"; opt.style.color = "#00b4d8"; }
            sel.add(opt);
        });
    }

    async function carregarDados() {
        carregarPortas();
        const res = await fetch('/listar_ficheiros');
        const files = await res.json();
        const sel = document.getElementById('selectFicheiro');
        sel.innerHTML = "";
        files.forEach(f => sel.add(new Option(f, f)));
    }

    socket.on('log', msg => {
        logsAcumulados += msg.data;
        let linha = document.createElement('div');
        linha.className = 'log-line';
        let txt = msg.data.trim();
        
        if(txt.includes('Writing at')) {
            linha.classList.add('log-info');
            document.getElementById('barraProgresso').style.width = "70%";
            document.getElementById('statusTexto').innerText = "A gravar...";
        } else if (txt.includes('Hard resetting')) {
            linha.classList.add('log-success');
            document.getElementById('statusTexto').innerText = "Reiniciando...";
        } else if (txt.toLowerCase().includes('error')) {
            linha.classList.add('log-error');
        }

        linha.innerText = txt;
        if(txt !== "") { consolaDiv.appendChild(linha); consolaDiv.scrollTop = consolaDiv.scrollHeight; }
    });

    socket.on('fim_processo', msg => {
        if(msg.sucesso) {
            document.getElementById('barraProgresso').style.width = "100%";
            document.getElementById('statusTexto').innerText = "Concluído!";
            document.getElementById('barraProgresso').classList.remove('progress-bar-animated');
        } else {
            document.getElementById('barraProgresso').classList.add('bg-danger');
            document.getElementById('statusTexto').innerText = "Erro!";
        }
    });

    function iniciarProcesso(modo) {
        const porta = document.getElementById('selectPorta').value;
        const baud = document.getElementById('selectBaud').value;
        const ficheiro = document.getElementById('selectFicheiro').value;

        if(!porta) return alert("Selecione uma porta!");
        
        if(modo === 'apenas_limpar') {
            if(!confirm("⚠️ ATENÇÃO: Deseja realmente formatar (Erase) o chip? Todo o programa atual será apagado.")) return;
        }

        if(modo === 'flash_limpo' && !ficheiro) return alert("Selecione um ficheiro .bin!");

        limparConsola();
        document.getElementById('barraProgresso').style.width = "5%";
        document.getElementById('statusTexto').innerText = "Iniciando...";
        socket.emit('iniciar_processo', { porta, baud, ficheiro, modo });
    }

    async function fazerUpload() {
        const input = document.getElementById('uploadInput');
        if(input.files.length === 0) return alert("Escolha um ficheiro!");
        const formData = new FormData();
        formData.append('file', input.files[0]);
        const res = await fetch('/upload', { method: 'POST', body: formData });
        const json = await res.json();
        if(json.sucesso) { carregarListaGestao(); alert("Carregado com sucesso!"); }
    }

    async function carregarListaGestao() {
        const res = await fetch('/listar_ficheiros');
        const files = await res.json();
        const lista = document.getElementById('listaFicheirosGestao');
        lista.innerHTML = "";
        files.forEach(f => {
            lista.innerHTML += `<li class="list-group-item d-flex justify-content-between align-items-center">${f}
                <button onclick="apagarFicheiro('${f}')" class="btn btn-sm btn-outline-danger"><i class="fas fa-trash"></i></button></li>`;
        });
    }

    async function apagarFicheiro(nome) {
        if(!confirm("Apagar " + nome + "?")) return;
        await fetch('/delete_file', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({filename: nome}) });
        carregarListaGestao();
    }

    function limparConsola() {
        consolaDiv.innerHTML = ""; logsAcumulados = "";
        document.getElementById('barraProgresso').style.width = "0%";
        document.getElementById('barraProgresso').className = "progress-bar progress-bar-striped progress-bar-animated";
        document.getElementById('statusTexto').innerText = "Pronto";
    }

    function baixarLogs() {
        const blob = new Blob([logsAcumulados], { type: "text/plain" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "log_esp.txt";
        link.click();
    }

    carregarDados();
</script>
</body>
</html>
