<div id="painel-offline" class="panel">
    <h2 class="mb-4 animate-stagger delay-1" style="color: var(--text-main); font-weight: 700;">Processamento de Logs (Modo Offline)</h2>
    <div class="row">
        <div class="col-md-6">
            <div class="custom-card mb-4 animate-stagger delay-2" style="border-left: 5px solid var(--accent);">
                <h5 class="mb-3 text-muted">1. Importar Ficheiro de Log (.txt)</h5>
                <div class="input-group mb-3">
                    <input type="file" id="offline-file" class="form-control" accept=".txt">
                    <button class="btn btn-outline-info fw-bold" onclick="analisarOffline()"><i class="fas fa-search me-2"></i> Analisar</button>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="custom-card animate-stagger delay-3" style="border-top-color: var(--warning);">
                <h5 class="mb-4 text-warning"><i class="fas fa-magic me-2"></i>2. Dados Extraídos</h5>
                <div class="row g-3 mb-4">
                    <div class="col-6"><label class="small fw-bold text-muted">MAC Address</label><input type="text" id="off-mac" class="form-control prod-input"></div>
                    <div class="col-6"><label class="small fw-bold text-warning">SN</label><div class="input-group"><input type="text" id="off-sn" class="form-control prod-input"><button class="btn btn-warning" onclick="gerarNovoSN('off-sn')" type="button"><i class="fas fa-sync-alt"></i></button></div></div>
                    <div class="col-6"><label class="small fw-bold text-muted">IMEI</label><input type="text" id="off-imei" class="form-control prod-input"></div>
                    <div class="col-6"><label class="small fw-bold text-danger">CIMI</label><input type="text" id="off-cimi" class="form-control prod-input"></div>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-primary w-50 py-2 fw-bold" onclick="processarOfflineCompleto(false)"><i class="fas fa-file-code me-2"></i> Só Gerar ZPL</button>
                    <button class="btn btn-success w-50 py-2 fw-bold" onclick="processarOfflineCompleto(true)"><i class="fas fa-save me-2"></i> Salvar e Imprimir</button>
                </div>
            </div>
        </div>
    </div>
</div>
