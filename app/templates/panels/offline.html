<div id="painel-offline" class="panel">
    <div class="panel-title">
        <span>Processamento de Logs</span>
    </div>
    
    <div class="row align-items-stretch">
        <div class="col-md-4 mb-4">
            <div class="custom-card card-flex-col h-100">
                <label class="label-section">1. Extrair de Ficheiro</label>
                
                <p class="card-description">Carregue o ficheiro de log gerado por ferramentas externas (ex: PuTTY) para extrair os identificadores.</p>
                
                <div class="input-group-section">
                    <label class="small mb-1">Ficheiro Bruto (.TXT)</label>
                    <input type="file" id="offline-file" class="form-control font-monospace" accept=".txt">
                </div>
                
                <div class="divider-section">
                    <button class="btn-action-primary w-100 py-3" onclick="analisarOffline()">Analisar e Extrair</button>
                </div>
            </div>
        </div>

        <div class="col-md-8 mb-4">
            <div class="custom-card card-flex-col h-100">
                <label class="label-section">2. Validação de Identificadores</label>
                
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="small mb-1">Mac Address</label>
                        <input type="text" id="off-mac" class="form-control prod-input" placeholder="...">
                    </div>
                    <div class="col-md-6">
                        <label class="small mb-1" style="color: var(--warning);">Serial Number</label>
                        <div class="input-group">
                            <input type="text" id="off-sn" class="form-control prod-input">
                            <button class="btn btn-outline-secondary" style="border: 1px solid var(--border);" onclick="gerarNovoSN('off-sn')"><i class="fas fa-random"></i></button>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="small mb-1">IMEI GSM</label>
                        <input type="text" id="off-imei" class="form-control prod-input" placeholder="...">
                    </div>
                    <div class="col-md-6">
                        <label class="small mb-1">CIMI SIM</label>
                        <input type="text" id="off-cimi" class="form-control prod-input" placeholder="...">
                    </div>
                </div>

                <div class="divider-section">
                    <button class="btn-action-primary w-100 py-3" onclick="processarOfflineCompleto(true)">Registar e Imprimir</button>
                </div>
            </div>
        </div>
    </div>
</div>
