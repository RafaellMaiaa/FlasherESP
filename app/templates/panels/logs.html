<div id="painel-logs" class="panel">
    <div class="panel-title">
        <div>Histórico de Produção</div>
        <div class="d-flex gap-2">
            <button class="btn-action-secondary" style="padding: 6px 12px; font-size: 11px;" onclick="carregarLogsDoCSV()">Atualizar</button>
            <button class="btn-action-secondary admin-only" style="padding: 6px 12px; font-size: 11px; color: var(--danger);" onclick="apagarTudoCSV()">Purgar Dados</button>
        </div>
    </div>
    
    <div class="custom-card p-0 overflow-hidden" style="border-radius: 8px; border: 1px solid var(--border);">
        <div class="table-responsive" style="max-height: 600px; overflow-y: auto; background-color: var(--bg-panel);">
            <table class="table mb-0 w-100" style="border-collapse: collapse;">
                <thead style="background-color: #0c0c0e; position: sticky; top: 0; z-index: 1;">
                    <tr>
                        <th class="small py-3 px-4" style="border-bottom: 1px solid var(--border); color: #8b8b93; font-weight: 600;">Data / Hora</th>
                        <th class="small py-3 px-4" style="border-bottom: 1px solid var(--border); color: #8b8b93; font-weight: 600;">Mac Address</th>
                        <th class="small py-3 px-4" style="border-bottom: 1px solid var(--border); color: #8b8b93; font-weight: 600;">Serial Number</th>
                        <th class="small py-3 px-4" style="border-bottom: 1px solid var(--border); color: #8b8b93; font-weight: 600;">IMEI</th>
                        <th class="small py-3 px-4" style="border-bottom: 1px solid var(--border); color: #8b8b93; font-weight: 600;">CIMI</th>
                        <th class="small py-3 px-4" style="border-bottom: 1px solid var(--border); color: #8b8b93; font-weight: 600;">Perfil</th>
                        <th class="small py-3 px-4 admin-only text-end" style="border-bottom: 1px solid var(--border); color: #8b8b93; font-weight: 600;">Ações</th>
                    </tr>
                </thead>
                <tbody id="table-logs-body" class="font-monospace" style="font-size: 13px;">
                </tbody>
            </table>
        </div>
    </div>
</div>
