<div id="painel-flash" class="panel active">
    <div class="d-flex justify-content-between align-items-center mb-3 animate-stagger delay-1">
        <h2 style="color: var(--text-main); font-weight: 700; margin:0;">Painel de Produção</h2>
    </div>
    
    <div class="row align-items-stretch">
        <div class="col-md-3 mb-3">
            <div class="custom-card h-100 d-flex flex-column m-0 animate-stagger delay-2" style="margin-bottom: 0 !important;">
                <h5 class="mb-3 text-muted text-uppercase" style="font-size: 0.9rem; font-weight: 700;"><i class="fas fa-sliders-h me-2"></i>Configuração</h5>
                <div class="flex-grow-1">
                    <label class="fw-bold small text-muted mb-1">PORTA COM</label>
                    <div class="input-group mb-3"><select id="selectPorta" class="form-select form-select-sm"></select><button class="btn btn-sm btn-outline-secondary" onclick="carregarPortas()"><i class="fas fa-sync"></i></button></div>
                    <label class="fw-bold small text-muted mb-1">VELOCIDADE</label>
                    <select id="selectBaud" class="form-select form-select-sm mb-3"><option value="115200" selected>115200</option><option value="460800">460800</option></select>
                    <label class="fw-bold small text-muted mb-1">FIRMWARE (.BIN)</label>
                    <select id="selectFicheiro" class="form-select form-select-sm mb-3"></select>
                </div>
                <div class="mt-auto">
                    <hr class="text-muted opacity-25 my-2">
                    <button onclick="iniciar('flash_limpo')" class="btn btn-primary btn-sm w-100 py-2 fw-bold shadow mb-2">APENAS FLASH</button>
                    <button onclick="iniciar('apenas_limpar')" class="btn btn-outline-danger btn-sm w-100 py-2 fw-bold">APENAS LIMPAR</button>
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-3">
            <div class="custom-card p-0 h-100 d-flex flex-column m-0 animate-stagger delay-3 overflow-hidden" style="border-top: none; margin-bottom: 0 !important;">
                <div class="console-tabs w-100">
                    <button class="console-tab active" onclick="switchConsole('install')" id="tab-install"><i class="fas fa-cogs me-2"></i>LOG INSTALAÇÃO</button>
                    <button class="console-tab" onclick="switchConsole('monitor')" id="tab-monitor"><i class="fas fa-tv me-2"></i>MONITOR SERIAL</button>
                </div>
                <!-- O SEGREDO AQUI: height: 0 e flex-grow-1 permite que a consola se adapte às caixas laterais sem forçar tamanho -->
                <div class="console-wrapper flex-grow-1 border-0 rounded-0" style="height: 0; min-height: 380px;">
                    <div class="console-toolbar">
                        <div id="tools-install" class="d-flex align-items-center w-100 justify-content-between">
                            <div class="d-flex align-items-center"><span class="text-white fw-bold small me-3">STATUS: <span id="status-text" class="text-info">PRONTO</span></span><span id="flash-timer" class="badge bg-secondary" style="font-family: monospace; font-size: 14px; display: none;">00.0s</span></div>
                            <div><button onclick="guardarLogs()" class="btn btn-sm btn-outline-secondary me-1"><i class="fas fa-save"></i></button><button onclick="limparEcra()" class="btn btn-sm btn-outline-secondary"><i class="fas fa-trash"></i></button></div>
                        </div>
                        <div id="tools-monitor" class="d-flex align-items-center w-100 justify-content-between" style="display: none !important;">
                            <div class="d-flex align-items-center"><select id="monitorBaud" class="form-select form-select-sm me-2" style="width: 90px;"><option value="115200" selected>115200</option><option value="9600">9600</option></select><button onclick="toggleMonitor()" id="btn-monitor" class="btn btn-sm btn-outline-info fw-bold"><i class="fas fa-plug me-1"></i> Conectar</button></div>
                            <div><button onclick="guardarLogs()" class="btn btn-sm btn-outline-secondary me-1"><i class="fas fa-save"></i></button><button onclick="limparEcra()" class="btn btn-sm btn-outline-secondary"><i class="fas fa-trash"></i></button></div>
                        </div>
                    </div>
                    <div class="progress" style="height: 4px; border-radius: 0; background-color: var(--bg-main);"><div id="barra" class="progress-bar bg-success" style="width: 0%; transition: width 0.3s;"></div></div>
                    <div id="consola" class="console-output"><div style="color: var(--text-muted);">> Sistema pronto e aguardando comandos.</div></div>
                </div>
            </div>
        </div>

        <div class="col-md-3 mb-3">
            <div class="custom-card h-100 d-flex flex-column m-0 animate-stagger delay-4" style="border-top-color: var(--warning); margin-bottom: 0 !important;">
                <button id="btn-automacao" onclick="iniciarAutomacaoMES()" class="btn btn-mega w-100 py-2 mb-3 fw-bold"><i class="fas fa-bolt fa-lg me-2"></i> TUDO EM 1<br><span class="small" style="font-weight: 600;">Flash + Lê Logs + ZPL</span></button>
                <div class="flex-grow-1">
                    <p class="small fw-bold text-muted mb-2"><i class="fas fa-search me-2"></i>DADOS EXTRAÍDOS:</p>
                    <div class="mb-2"><label class="small fw-bold">MAC Address</label><input type="text" id="input-mac" class="form-control form-control-sm prod-input" readonly></div>
                    <div class="mb-2"><label class="small fw-bold text-warning">SN</label><div class="input-group input-group-sm"><input type="text" id="input-sn" class="form-control prod-input"><button class="btn btn-warning fw-bold" onclick="gerarNovoSN('input-sn')" type="button"><i class="fas fa-sync-alt"></i></button></div></div>
                    <div class="mb-2"><label class="small fw-bold">IMEI</label><input type="text" id="input-imei" class="form-control form-control-sm prod-input" readonly></div>
                    <div class="mb-2"><label class="small fw-bold text-danger">CIMI</label><input type="text" id="input-cimi" class="form-control form-control-sm prod-input" readonly></div>
                </div>
                <div class="mt-auto pt-2"><button onclick="forcarLeituraVisual()" class="btn btn-sm btn-outline-secondary w-100"><i class="fas fa-eye"></i> Ler Consola Manualmente</button></div>
            </div>
        </div>
    </div>
</div>
