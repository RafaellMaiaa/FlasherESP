<div id="painel-arquivos" class="panel">
    <div class="panel-title">
        <span>Gestão de Firmwares</span>
    </div>
    
    <div class="row align-items-stretch">
        <div class="col-md-4 mb-4">
            <div class="custom-card card-flex-col h-100">
                <label class="label-section">Adicionar Firmware</label>
                
                <p class="card-description">Carregue ficheiros .bin compilados para disponibilizar no ambiente de produção.</p>
                
                <div class="input-group-section">
                    <label class="small mb-1">Novo Ficheiro (.BIN)</label>
                    <input type="file" id="file-bin" class="form-control font-monospace" accept=".bin">
                </div>
                
                <div class="divider-section">
                    <button class="btn-action-primary w-100 py-3" onclick="uploadArquivo('file-bin', '/upload_file')">Inserir Firmware</button>
                </div>
            </div>
        </div>

        <div class="col-md-8 mb-4">
            <div class="custom-card card-flex-col h-100">
                <div class="card-header-label">
                    <span class="label-text">Repositório Local</span>
                    <button class="btn-action-secondary" onclick="carregarArquivos()" style="padding: 4px 8px; font-size: 11px;">Atualizar</button>
                </div>
                
                <ul id="listaFiles" class="list-group list-group-flush mb-0" style="max-height: 450px; overflow-y: auto;">
                </ul>
            </div>
        </div>
    </div>
</div>
