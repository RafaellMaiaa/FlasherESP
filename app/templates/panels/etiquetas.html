<div id="painel-etiquetas" class="panel">
    <div class="panel-title">
        <span>Módulo ZPL</span>
    </div>
    
    <div class="row align-items-stretch">
        <div class="col-md-4 mb-4">
            <div class="custom-card card-flex-col h-100">
                <label class="label-section">Inserir Novo Molde</label>
                
                <p class="card-description">Carregue ficheiros .zpl ou .txt contendo a estrutura base para a impressora térmica.</p>
                
                <div class="input-group-section">
                    <label class="small mb-1">Ficheiro de Código</label>
                    <input type="file" id="file-zpl" class="form-control font-monospace" accept=".zpl,.txt">
                </div>
                
                <div class="divider-section">
                    <button class="btn-action-primary w-100 py-3" onclick="uploadArquivo('file-zpl', '/upload_etiqueta')">Carregar Molde</button>
                </div>
            </div>
        </div>

        <div class="col-md-8 mb-4">
            <div class="custom-card card-flex-col h-100">
                <div class="card-header-label">
                    <span class="label-text">Moldes Disponíveis</span>
                    <button class="btn-action-secondary" onclick="carregarEtiquetas()" style="padding: 4px 8px; font-size: 11px;">Refresh</button>
                </div>
                
                <ul id="listaEtiquetas" class="list-group list-group-flush mb-0" style="max-height: 450px; overflow-y: auto;">
                </ul>
            </div>
        </div>
    </div>
</div>
